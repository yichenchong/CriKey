[package]
name = "crikey-package-manager"
description = "Plugin package install, verification, lockfiles, atomic updates and rollback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
crikey-core.workspace = true
crikey-platform.workspace = true
crikey-plugin-model.workspace = true
serde.workspace = true
# The plugin index document format (ADR 0013). JSON rather than TOML because
# the index is generated and consumed by machines, never hand-edited.
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
# Ed25519 detached package signatures (spec 2.2, 23.3). A package's embedded
# per-member lock says "these are the bytes someone packaged"; only a signature
# says who. `verify_strict` is what makes a signature that verifies here verify
# identically everywhere, and the `zeroize` feature is why a signing key does
# not outlive the one operation that needed it. Default features off: the
# `rand_core` half is deliberately unused, because key generation goes through
# `getrandom` rather than adding a second RNG lineage to this tree.
ed25519-dalek.workspace = true
# 32 bytes from the operating system's CSPRNG for `crikey package keygen`. The
# only randomness this crate needs, and the only supply of it a signing key may
# come from.
getrandom.workspace = true
zip.workspace = true
thiserror.workspace = true
ureq.workspace = true
