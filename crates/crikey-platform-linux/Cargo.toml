[package]
name = "crikey-platform-linux"
description = "Linux platform backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
crikey-core.workspace = true
crikey-platform.workspace = true

# X11 is what the global-hotkey backend grabs against, and it exists only on
# this target: a shared dependency table would break the Windows and macOS
# cross-target checks.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"
# D-Bus for the Wayland half of the backend: global shortcuts there are the
# `org.freedesktop.portal.GlobalShortcuts` portal and nothing else (ADR-0011).
# Target-gated with the X11 client for the same reason -- the Windows and macOS
# cross-target checks must never see it -- and pinned to the blocking API over
# `async-io`, because this crate has no async runtime and must not acquire a
# second one through a default feature set.
#
# Held below 5.14: that release and everything after it requires rustc 1.87,
# and the workspace MSRV is 1.86 (ADR-0002). Its `zvariant`, `zbus_names` and
# `zbus_macros` requirements are carets, so the same line has to be held in
# `Cargo.lock` for them; raising this bound means raising the MSRV first.
zbus = { version = ">=5.13, <5.14", default-features = false, features = ["blocking-api", "async-io"] }
# The X11 backends' tests drive a server directly, so the same client library
# is needed at test time, gated the same way. The `xtest` feature is what lets
# the delivery tests synthesise a real key press against their own Xvfb:
# without it nothing in the suite can prove a grabbed chord ever reaches the
# activation handler.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
# The portal tests stand up a `GlobalShortcuts` portal of their own on a
# private bus, which needs the server half of the same library -- an
# integration test can only reach the crate's dev-dependencies, so it is named
# again here rather than inherited.
zbus = { version = ">=5.13, <5.14", default-features = false, features = ["blocking-api", "async-io"] }
