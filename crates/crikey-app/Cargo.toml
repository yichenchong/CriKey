[package]
name = "crikey-app"
description = "Composition root: wires core, scheduler, hosts and platform backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
crikey-core.workspace = true
crikey-catalog.workspace = true
crikey-input-scheduler.workspace = true
crikey-legacy-compat.workspace = true
crikey-native-host.workspace = true
crikey-package-manager.workspace = true
crikey-platform.workspace = true
crikey-plugin-model.workspace = true
crikey-plugin-supervisor.workspace = true
crikey-sandbox.workspace = true
crikey-python-host.workspace = true
crikey-query.workspace = true
crikey-ranking.workspace = true
crikey-result-aggregator.workspace = true
crikey-ui.workspace = true
# SHA-256 over a fetched remote catalog document (ADR-0016). The same algorithm
# the package manager verifies a downloaded package with, for the same reason:
# a digest that decides whether third-party content is admitted is a security
# claim, not a corruption check.
sha2.workspace = true
# The one place this crate touches the network: fetching a configured remote
# catalog document (ADR-0016). Already `https_only` with `rustls` at the
# workspace level, and behind the `CatalogFetcher` trait, so no test here opens
# a socket.
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crikey-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
crikey-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
crikey-platform-linux.workspace = true
