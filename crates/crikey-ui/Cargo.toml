[package]
name = "crikey-ui"
description = "Launcher window, view model and presentation contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
crikey-core.workspace = true
# Not for a platform service: the UI calls none. `crikey-platform` owns
# `IconImage`, the decoded-pixel value type a row carries, and it depends on
# nothing but `crikey-core`, so naming it here adds no desktop API to a crate
# that must not have one (spec 5.3).
crikey-platform.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
egui-wgpu.workspace = true
egui-winit = { workspace = true, features = ["clipboard"] }
pollster.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, features = ["dx12", "metal", "wgsl"] }
winit = { workspace = true, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

# Only the Windows target links Win32, so a Linux or macOS build of this crate
# still compiles. `session_end` needs a real dependency rather than the
# hand-written constants `system_char` gets away with: a window subclass is
# `comctl32` entry points, not numbers.
[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    # The crate's own default, restored explicitly because the workspace
    # declaration turns defaults off to keep the feature list auditable.
    "std",
    # `HWND`, `WPARAM`, `LPARAM`, `LRESULT`.
    "Win32_Foundation",
    # `SetWindowSubclass`, `DefSubclassProc`, `RemoveWindowSubclass`.
    "Win32_UI_Shell",
    # `CreateRoundRectRgn`, which cuts the launcher's rounded shape out of a
    # window whose swapchain cannot carry alpha.
    "Win32_Graphics_Gdi",
    # `WM_QUERYENDSESSION`, `WM_ENDSESSION`, `WM_NCDESTROY`.
    "Win32_UI_WindowsAndMessaging",
]

# X11 is the other window system whose surfaces will not state that they
# blend, so the launcher's shape is clipped there too -- see `window_shape`.
# Same footing as the Win32 dependency above: this is the crate that owns the
# launcher's window, and shaping that window is not a platform service.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }

[dev-dependencies]
# The renderer tests build rows carrying real decoded pixels, because the
# assertion is that those exact bytes reach the frame's texture uploads.
crikey-platform.workspace = true

# `winit` refuses to build an event loop off the process main thread and allows
# exactly one per process, and libtest runs `#[test]` functions on worker
# threads. Driving the shipped `NativeLauncher` from a test therefore requires
# owning `main`, which is what `harness = false` gives.
[[test]]
name = "ime_x11"
harness = false

# Same reason as `ime_x11`: it drives the shipped `NativeLauncher`, so it owns
# `main`. A separate binary rather than a case inside that one because winit
# allows one event loop per process.
[[test]]
name = "provider_answer_wake"
harness = false
