[package]
name = "crikey-web-host"
description = "Out-of-process host for a WPE WebKit web surface behind a plugin page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "crikey-web-host"
path = "src/main.rs"
required-features = ["engine"]

[lints]
workspace = true

[features]
# OFF by default, and the reason is CI rather than taste. `.github/workflows`
# runs `cargo clippy --workspace` and `cargo test --workspace` on runners that
# have no WPE, and a default-on engine feature makes `build.rs` panic there --
# so the whole workspace would go red on every machine that is not a packaging
# box. Default-off inverts that: the engine-free half of this crate, which is
# where the correctness arguments live, is checked and tested everywhere, and
# only a build that means to link an engine asks for one.
#
# The packaging driver turns it on explicitly (`--features engine`), and the
# executable below cannot be built without it.
default = []
engine = []

[dependencies]
crikey-core.workspace = true
crikey-native-protocol.workspace = true
thiserror.workspace = true

[build-dependencies]
# Keep the C compiler and WPE package discovery local to the one crate that
# links the browser engine. Other workspace crates can link platform libraries;
# neither WPE probing nor its link directives belong in those crates.
cc = "1"
pkg-config = "0.3"
