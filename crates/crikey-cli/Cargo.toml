[package]
name = "crikey-cli"
description = "The `crikey` command line and the `crikey-launcher` graphical entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Two binaries over one library. `crikey` must stay console-subsystem so its
# subcommands can print; `crikey-launcher` must be GUI-subsystem on Windows so
# no console appears beside the launcher, and must need no arguments because a
# macOS bundle and an MSIX tile cannot pass any. Both are thin `main`s over
# `crikey_cli`, so there is one launcher implementation, not two.
[[bin]]
name = "crikey"
path = "src/bin/crikey.rs"

[[bin]]
name = "crikey-launcher"
path = "src/bin/crikey-launcher.rs"

[dependencies]
crikey-app.workspace = true
crikey-benchmarks.workspace = true
crikey-catalog.workspace = true
# The layered configuration store (spec 21.2): `crikey plugin enable/disable`
# and `crikey plugin scheduling-profile` persist through it, and `crikey run`
# reads the disabled set from it before any provider loads.
crikey-config.workspace = true
crikey-core.workspace = true
crikey-input-scheduler.workspace = true
# The M3 developer commands (`dev test-legacy-compat`, `dev inspect-catalog`,
# `dev compatibility-report`) drive the Legacy Compatibility Layer directly:
# package loading, interpreter discovery, the CPython worker, `legacy-strict`
# scheduling and the version-controlled compatibility data (spec 26.3, 28).
crikey-legacy-compat.workspace = true
# `RuntimeProfile`, interpreter discovery and the modern CPython worker
# (spec 14.11, 15.6): `dev run`/`dev test` drive a real worker end to end.
crikey-python-host.workspace = true
crikey-native-host.workspace = true
crikey-native-protocol.workspace = true
# Managed environments (spec 15.3, 15.4, 23.2): resolve and materialise a
# modern plugin's declared dependencies before spawning its worker.
crikey-package-manager.workspace = true
# `Manifest`: parse a modern plugin's `crikey.toml` (id, entrypoint, `[python]`).
crikey-plugin-model.workspace = true
# `StandardDirectories`/`PluginKind` (spec 21.2, 23): where plugins are
# installed and where the configuration lives. Platform-independent; naming a
# backend crate remains `crikey-app`'s alone (ADR-0001).
crikey-platform.workspace = true
# `ConcurrencyBudget` (spec 13.5): `crikey plugin doctor` builds a plugin's
# declared budgets and probes admission of each of the four work kinds.
crikey-plugin-supervisor.workspace = true
crikey-sandbox.workspace = true
crikey-ui.workspace = true

# `crikey-launcher` is GUI-subsystem on Windows, so a fatal startup failure has
# no console to be printed to. `MessageBoxW` is the one channel a process with
# no window of its own has to say why it is about to exit. Only the Windows
# target links Win32; every other build of this crate downloads nothing.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    # The crate's own default, restored explicitly because the workspace
    # declaration turns defaults off to keep the feature list auditable.
    "std",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# The integration tests build signed plugin-index fixtures (ADR-0013): a
# signing key, a trust store and the digest the client will recompute. A test
# that hand-rolled Ed25519 would be testing its own crypto, not the client's.
crikey-package-manager.workspace = true
# `crikey catalog` tests publish a remote catalog document and the SHA-256 the
# client will recompute for it (ADR-0016). Computing the digest with the same
# algorithm the client uses is the point; a hand-rolled one would only agree
# with itself.
sha2.workspace = true
