[workspace]
resolver = "2"
members = [
    "crates/crikey-core",
    "crates/crikey-query",
    "crates/crikey-ranking",
    "crates/crikey-catalog",
    "crates/crikey-result-aggregator",
    "crates/crikey-input-scheduler",
    "crates/crikey-plugin-model",
    "crates/crikey-config",
    "crates/crikey-plugin-supervisor",
    # Kernel-enforced confinement for every supervised plugin child process.
    "crates/crikey-sandbox",
    "crates/crikey-native-protocol",
    "crates/crikey-native-host",
    "crates/crikey-python-host",
    # Out-of-process hosts for the two runtimes that must never be loaded into
    # the launcher: a `.wasm` module and a restricted C-ABI shared library each
    # run inside their own supervised executable, which speaks the native
    # protocol on the plugin's behalf (ADR-0014, ADR-0015; acceptance 30).
    "crates/crikey-wasm-host",
    "crates/crikey-cabi-host",
    "crates/crikey-legacy-compat",
    "crates/crikey-platform",
    "crates/crikey-platform-windows",
    "crates/crikey-platform-macos",
    "crates/crikey-platform-linux",
    "crates/crikey-package-manager",
    "crates/crikey-ui",
    "crates/crikey-app",
    "crates/crikey-cli",
    "sdk/rust",
    "benchmarks",
]

# The native-plugin conformance fixture is deliberately OUT of this workspace:
# acceptance §31.21 is about a plugin built the way a third party builds one,
# against the published SDK by path, with its own lockfile and target dir.
exclude = ["compatibility/native-conformance"]

[workspace.package]
version = "0.1.17"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/crikey-launcher/crikey"
authors = ["The CriKey Authors"]

[workspace.dependencies]
crikey-core = { path = "crates/crikey-core", version = "0.1.0" }
crikey-query = { path = "crates/crikey-query", version = "0.1.0" }
crikey-ranking = { path = "crates/crikey-ranking", version = "0.1.0" }
crikey-catalog = { path = "crates/crikey-catalog", version = "0.1.0" }
crikey-result-aggregator = { path = "crates/crikey-result-aggregator", version = "0.1.0" }
crikey-input-scheduler = { path = "crates/crikey-input-scheduler", version = "0.1.0" }
crikey-plugin-model = { path = "crates/crikey-plugin-model", version = "0.1.0" }
crikey-config = { path = "crates/crikey-config", version = "0.1.0" }
crikey-plugin-supervisor = { path = "crates/crikey-plugin-supervisor", version = "0.1.0" }
crikey-sandbox = { path = "crates/crikey-sandbox", version = "0.1.0" }
crikey-native-protocol = { path = "crates/crikey-native-protocol", version = "0.1.0" }
crikey-native-host = { path = "crates/crikey-native-host", version = "0.1.0" }
crikey-python-host = { path = "crates/crikey-python-host", version = "0.1.0" }
crikey-legacy-compat = { path = "crates/crikey-legacy-compat", version = "0.1.0" }
crikey-platform = { path = "crates/crikey-platform", version = "0.1.0" }
crikey-platform-windows = { path = "crates/crikey-platform-windows", version = "0.1.0" }
crikey-platform-macos = { path = "crates/crikey-platform-macos", version = "0.1.0" }
crikey-platform-linux = { path = "crates/crikey-platform-linux", version = "0.1.0" }
crikey-package-manager = { path = "crates/crikey-package-manager", version = "0.1.0" }
crikey-ui = { path = "crates/crikey-ui", version = "0.1.0" }
crikey-app = { path = "crates/crikey-app", version = "0.1.0" }
crikey-benchmarks = { path = "benchmarks", version = "0.1.0" }

egui = { version = "=0.29.1", default-features = false }
egui-wgpu = { version = "=0.29.1", default-features = false }
egui-winit = { version = "=0.29.1", default-features = false }
pollster = "=0.3.0"
wgpu = { version = "=22.1.0", default-features = false }
winit = { version = "=0.30.5", default-features = false }
serde = { version = "1", features = ["derive"] }
# JSON-lines framing for the two out-of-process Python transports: the legacy
# CPython worker (spec 14) and the modern Python worker. Neither uses the
# protobuf schema, which ADR 0010 scopes deliberately to the native transport
# only; there is no separate decision record for the JSON transports, and none
# is owed, because ADR 0010 already records why they are out of its scope.
serde_json = "1"
toml = "0.8"
thiserror = "2"

# Activation patterns declared in third-party plugin manifests (spec 8.11,
# 19.4), compiled by `crikey-core` and evaluated by the query scheduler on
# every keystroke. The engine choice is the security decision: `regex` compiles
# to finite automata and matches in time linear in the subject, so a hostile or
# merely careless manifest cannot wedge the scheduler thread the way a
# backtracking engine can be wedged by `(a+)+$`. A hand-rolled matcher would be
# a second, unreviewed implementation of exactly that guarantee, and the
# alternative of restricting authors to literal prefixes is what this feature
# exists to lift. `default-features = false` drops the Unicode tables the
# launcher does not need for query text; `unicode-perl` keeps `\d`, `\w` and
# `\s` Unicode-aware, which query text demands, and `std` keeps the engine's
# error types wired into `thiserror`.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# SHA-256 for the modern Python package manager (spec 23.2, 23.3). A lockfile
# pins each resolved package's digest and materialisation recomputes and
# compares it, so a tampered or wrong artefact is refused. This is a security
# claim about third-party code, unlike the legacy layer's non-cryptographic
# cache-reuse digest, so it uses the algorithm pip and PEP 503 use rather than a
# hand-rolled hash.
sha2 = "0.10"

# Ed25519 signatures for plugin package provenance (spec 2.2, 23.2). The
# per-member digests `sha2` already checks prove a package is internally
# consistent, not that it came from anyone in particular: a hostile package,
# rebuilt correctly, verifies. Signatures are the missing half. Ed25519 rather
# than RSA or ECDSA because the public key and the signature are both short
# enough to print as a fingerprint a human can compare out of band, and the
# scheme has no parameter choices left to get wrong at the call site. The
# `rand_core` feature stays off deliberately: keys are seeded from `getrandom`
# below and built with `SigningKey::from_bytes`, so the tree carries one
# random source rather than two that can drift apart.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

# The one CSPRNG. Already present transitively; naming it here means key
# generation, session tokens and endpoint names all draw from the same source
# instead of each crate opening `/dev/urandom` for itself.
getrandom = "0.3"

# Dynamic library loading, used by exactly one crate: `crikey-cabi-host`, the
# separate executable that hosts a restricted C-ABI plugin. It is named here
# rather than left crate-local because the workspace's most important
# invariant is about this exact operation — acceptance criterion 30 says the
# main process never loads arbitrary third-party native libraries — and a
# reader auditing that claim should find the one consumer from the dependency
# table instead of grepping for `dlopen`. Any second consumer appearing here is
# a review failure, not a convenience.
libloading = "0.8"
unicode-normalization = "0.1.24"
unicode-casefold = "0.2.0"
unicode-general-category = "1.1.0"

# ZIP container support. Required by the Legacy Compatibility Layer to read
# `.keypirinha-package` archives and by the native package manager to build and
# verify plugin archives. Its tests also build well-formed archive fixtures.
# `deflate` is the only compression method a Keypirinha package uses beyond
# `stored`.
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP client for the one place CriKey fetches bytes over the network: a plugin
# package named by URL (spec 23.1). `rustls` rather than the platform TLS stack
# so the trust decision is identical on every target and needs no system
# OpenSSL; default features are off so the JSON, cookie and gzip layers of a
# general-purpose client are not linked into a launcher that only ever performs
# one GET to a file. Every test injects a fake `PackageFetcher` instead, so no
# test in this workspace opens a socket.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Icon decoding (spec 6.4, 18.1, 22.1). Deliberately two narrow decoders rather
# than the `image` crate: a launcher needs exactly the formats desktop icon
# themes and application bundles actually ship, and `image` would pull JPEG,
# TIFF, BMP, GIF, WebP, DDS, HDR and farbfeld into a binary that draws 48x48
# squares.
#
# * `png` covers the raster half. It is also the frame encoding inside every
#   modern `.ico` and `.icns`, whose containers are parsed by hand in
#   `crikey-platform` because a container walk is a hundred lines and the
#   dedicated crates for them would each add a second copy of this decoder.
# * `resvg` covers the vector half, which on Linux is not a nicety: Adwaita
#   ships 715 SVGs against 51 PNGs, so a PNG-only backend would find nothing
#   for most themed icon names. Default features are off, which drops the
#   `fontdb`/`rustybuzz` text stack, `svgz`, and the raster-image codecs whose
#   job `png` already does here; SVG text elements are consequently not
#   rendered, which icon artwork does not use.
png = "0.18"
resvg = { version = "0.48", default-features = false }

# The OS clipboard, behind `Capability::Clipboard` in all three platform
# backends (spec 18.2), and named here rather than three times over because all
# three want the same mechanism.
#
# A crate rather than a hand-written binding per target, because "put this text
# on the clipboard" is not one call on any of them. X11 has no clipboard store
# at all: a selection has an *owner*, and some client must stay resident and
# answer `SelectionRequest` for as long as the value is supposed to exist --
# `arboard` runs exactly that server on a helper thread for the lifetime of the
# instance. Win32 wants `OpenClipboard` retried while another process holds it,
# and macOS wants a pasteboard whose `generalPasteboard` really can be null in a
# daemon. Three unreviewed FFI implementations of that, two of which nobody in
# this workspace can run, is the alternative.
#
# It costs no new dependency tree either: `arboard` is already in this
# workspace's lock as `egui-winit`'s clipboard, and on Linux it speaks X11
# through the same `x11rb` the hotkey and window backends already use.
# `default-features = false` drops `image-data`, which would pull the whole
# `image` crate in to move pixels a launcher never puts on a clipboard -- and
# would be the one line here that changed `Cargo.lock`.
arboard = { version = "3.6", default-features = false }

# Microsoft's generated Win32/COM bindings, used by Windows-specific code
# (the platform backend and the native named-pipe transport) and pulled in
# only on that target (spec 18.4). Hand-written `extern "system"` declarations
# for `.lnk` resolution, Start-app enumeration and named-pipe APIs would be a
# second, unreviewed copy of the same ABI.
windows = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

# Dev and test builds link roughly a hundred separate test binaries across this
# workspace, several of which statically link wgpu, winit and egui. Under
# Cargo's defaults (full DWARF debug info plus incremental artefacts) the
# `target/debug` directory produced by CI's own
# `cargo test --workspace --all-targets` grew past 50 GB and exhausted the
# disk. Workspace crates keep file/line tables so panic backtraces still name a
# source location; third-party dependencies, which dominate the byte count and
# are not the code under test, are stripped of debug info entirely.
# `[profile.test]` inherits these settings from `[profile.dev]`.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
