[project]
name = "crikey-sdk"
version = "0.1.0"
description = "Official Python SDK for CriKey plugins."
requires-python = ">=3.12"
license = "Apache-2.0"
# NOTE: a PLUGIN's own `requires-python` and `dependencies` are read from that
# plugin's manifest/pyproject (spec 15.2) and resolved into a managed
# environment by `crikey-package-manager` -- they are NOT declared here. The SDK
# itself is pure stdlib and has no third-party runtime dependencies.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crikey_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"_crikey_modern_worker.py" = "_crikey_modern_worker.py"
