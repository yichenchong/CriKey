syntax = "proto3";

// CriKey plugin protocol, version 1 (spec 16.3).
// Additive evolution only: never renumber or reuse a field tag.
// Unknown fields must round-trip: a decoder retains bytes it does not
// understand and re-emits them, so a newer peer talking to an older one never
// silently loses data.
package crikey.v1;

message Envelope {
  uint64 connection_id = 1;
  uint64 request_id = 2;
  // Query generation this message belongs to, when applicable (spec 8.1).
  uint64 generation = 3;
  // Milliseconds from receipt, when the host imposes a deadline.
  uint64 deadline_ms = 4;

  oneof payload {
    Handshake handshake = 10;
    HandshakeAck handshake_ack = 11;
    SuggestRequest suggest = 12;
    ResultBatch results = 13;
    Cancel cancel = 14;
    Shutdown shutdown = 15;
    CatalogRequest catalog_request = 16;
    CatalogBatch catalog_batch = 17;
    ExecuteRequest execute = 18;
    ExecuteResult execute_result = 19;
    ConfigurationChange configuration = 20;
    Event event = 21;
    LogRecord log = 22;
    HealthCheck health_check = 23;
    HealthReport health_report = 24;
    Error error = 25;
    FlowControl flow = 26;
    ResourceRequest resource_request = 27;
    ResourceResponse resource_response = 28;
    Lifecycle lifecycle = 29;
    LifecycleAck lifecycle_ack = 30;
    PageRequest page_request = 31;
    PageFrame page_frame = 32;
    // Host-to-host web surface traffic (spec 32.x). These never reach a
    // plugin process: they run between the launcher and crikey-web-host,
    // which is the only executable that links WPE.
    OpenSurface open_surface = 33;
    RawInput raw_input = 34;
    ImeEvent ime_event = 35;
    Navigate navigate = 36;
    Resize resize = 37;
    CloseSurface close_surface = 38;
    WebFrame web_frame = 39;
    CaretArea caret_area = 40;
    LoadState load_state = 41;
    Gone gone = 42;
    PreviewRequest preview_request = 43;
    PreviewResponse preview_response = 44;
    CommandsRequest commands_request = 45;
    CommandsResponse commands_response = 46;
    TypedExecuteRequest typed_execute_request = 47;
    TypedExecuteResponse typed_execute_response = 48;
  }
}

// Optional commands_v1. Request only on the same connection after its complete
// catalog; declarations name stable catalog targets, never inferred metadata.
// Host supplies owner and availability after checking its current catalog.
message CommandsRequest {}
message CommandDeclaration {
  string command_id = 1;
  string label = 2;
  string item_id = 3;
  string action_id = 4; // Empty means the item's primary execution path.
  int32 argument_policy = 5; // 1 forbidden, 2 optional, 3 required.
}
message CommandsResponse {
  int32 status = 1; // 1 declarations, 2 unsupported, 3 cancelled, 4 failed.
  repeated CommandDeclaration commands = 2;
  string detail = 3;
}

// Optional capability "preview_v1", intersected with host support. Only
// selected items declaring metadata["crikey.preview"]="deferred" are requested.
// Request identity is Envelope.connection_id/request_id/generation; replies echo
// all three. Cancel uses the same identity. Absence means unsupported, not empty.
message PreviewRequest { string item_id = 1; }
message PreviewValue {
  string label = 1;
  string value = 2;
  uint32 kind = 3; // 1 text, 2 deliberate-activation http(s) link, 3 tag
}
message PreviewResponse {
  uint32 status = 1; // 1 content, 2 empty, 3 unsupported, 4 cancelled, 5 failed
  string text = 2; // aggregate UTF-8 text <=256KiB; parsed nodes <=4096
  bool markdown = 3; // inert: no raw HTML/scripts or fetched markdown assets
  uint32 width = 4; // <=1024; decoded RGBA <=1MiB
  uint32 height = 5;
  bytes rgba = 6;
  repeated PreviewValue values = 7; // <=128, each label/value <=8KiB
  string detail = 8; // bounded diagnostic; failure never means empty success
  bytes encoded_png = 10; // <=1MiB, exclusive with rgba; decoded off paint thread
}

// ---------------------------------------------------------------------------
// Handshake and negotiation (spec 16.3, 16.6)
// ---------------------------------------------------------------------------

message Handshake {
  uint32 protocol_version = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  repeated string capabilities = 4;
  // Echoed back to the host so a connection cannot be hijacked by another
  // process that merely guessed the endpoint (spec 16.6).
  string session_token = 5;
  string plugin_name = 6;
  string sdk_version = 7;
}

message HandshakeAck {
  uint32 protocol_version = 1;
  repeated string host_capabilities = 2;
  string host_version = 3;
  // False when the host refuses the connection; `reject_reason` says why and
  // the plugin must exit.
  bool accepted = 4;
  string reject_reason = 5;
  uint64 max_frame_bytes = 6;
  // Result batches the plugin may send before the host replenishes credit
  // with a FlowControl message (spec 12.3).
  uint32 initial_credits = 7;
}

// ---------------------------------------------------------------------------
// Lifecycle (spec 13.2)
// ---------------------------------------------------------------------------

message Lifecycle {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    START = 1;
    STOP = 2;
    ACTIVATED = 3;
    DEACTIVATED = 4;
  }
  Kind kind = 1;
}

message LifecycleAck {
  Lifecycle.Kind kind = 1;
  bool ok = 2;
  Error error = 3;
}

// ---------------------------------------------------------------------------
// Catalog and suggestions (spec 16.5, 12.1, 12.5)
// ---------------------------------------------------------------------------

message CatalogRequest {
  // Zero means the host imposes no item ceiling beyond its own limits.
  uint64 max_items = 1;
}

message CatalogBatch {
  repeated Item items = 1;
  bool done = 2;
  uint64 sequence = 3;
  Error error = 4;
  ResultPresentation presentation = 5;
}

message SuggestRequest {
  string text = 1;
  string normalized_text = 2;
  // Item the user already selected, for argument suggestions.
  string selected_item_id = 3;
  // Per-query quota the host will enforce; zero means host default.
  uint64 max_items = 4;
  uint64 max_batches = 5;
  optional string selected_scope_id = 6;
}

// Category tags (spec 10.3) are encoded so that every distinct category has a
// distinct tag. A built-in category uses its canonical bare name
// ("application", "file", "directory", "url", "command", "expression",
// "keyword", "contact", "clipboard-item"). A PLUGIN-DEFINED category is
// prefixed with "plugin-defined:", because a plugin category merely named
// "application" is not the built-in one and must not decode into it. A bare
// unrecognised tag is still accepted as plugin-defined for SDKs that have not
// adopted the prefix.

message Action {
  string action_id = 1;
  string label = 2;
  string description = 3;
  string icon_reference = 4;
  // "host-mediated" or "plugin"; unknown values are treated as plugin.
  string execution_policy = 5;
  // Category tags this action applies to (spec 10.3, 10.4). Empty means the
  // action applies to any item the plugin returns.
  repeated string applicable_categories = 6;
}

message Item {
  string stable_id = 1;
  string label = 2;
  string description = 3;
  string target = 4;
  // Category tag; see the encoding note above `Action`.
  string category = 5;
  repeated string search_terms = 6;
  string icon_reference = 7;
  int32 score_hint = 8;
  map<string, string> metadata = 9;
  repeated Action actions = 10;
  // "forbidden", "optional" or "required" (spec 10.1); unknown values are
  // treated as "forbidden".
  string argument_policy = 11;
  // "recorded" or "ignored" (spec 10.1); unknown values are treated as
  // "recorded".
  string hit_policy = 12;
}

message ResultBatch {
  enum State {
    STATE_UNSPECIFIED = 0;
    PARTIAL = 1;
    FINAL = 2;
    CANCELLED = 3;
    FAILED = 4;
  }
  State state = 1;
  repeated Item items = 2;
  uint64 sequence = 3;
  Error error = 4;
  ResultPresentation presentation = 5;
}

message Cancel {
  string reason = 1;
}

// ---------------------------------------------------------------------------
// Action execution (spec 10.4, 16.3)
// ---------------------------------------------------------------------------

message ExecuteRequest {
  string item_id = 1;
  string action_id = 2;
  string argument = 3;
}

// Independently negotiated typed_arguments_v1 and result_presentation_v1.
// Owner/source authority comes exclusively from the endpoint.
message PresentationDeclaration { string id = 1; string label = 2; }
message ItemPresentation {
  string item_id = 1;
  optional string section_id = 2;
  repeated string scope_ids = 3;
}
message DropdownOption { string id = 1; string label = 2; }
message ArgumentField {
  string id = 1;
  string label = 2;
  bool required = 3;
  optional string placeholder = 4;
  optional string validation_message = 5;
  uint32 kind = 6; // 1 text, 2 password, 3 dropdown.
  uint32 min_bytes = 7;
  optional uint32 max_bytes = 8; // Omitted means 8192.
  bool multiline = 9;
  optional string default_value = 10; // Forbidden for passwords.
  repeated DropdownOption options = 11;
}
message ArgumentSchema { repeated ArgumentField fields = 1; }
message ExecutableSchemaBinding {
  string item_id = 1;
  optional string action_id = 2; // Absence is genuinely actionless.
  ArgumentSchema schema = 3;
}
message ResultPresentation {
  repeated PresentationDeclaration sections = 1;
  repeated PresentationDeclaration scopes = 2;
  repeated ItemPresentation items = 3;
  repeated ExecutableSchemaBinding schemas = 4;
}
message TypedValue {
  string field_id = 1;
  uint32 kind = 2; // 1 text, 2 password, 3 dropdown option ID.
  string value = 3;
}
message TypedExecuteRequest {
  string item_id = 1;
  optional string action_id = 2;
  bytes expected_fingerprint = 3; // Exactly 32 bytes, canonical Core v1 SHA-256.
  repeated TypedValue values = 4;
}
message TypedFieldFailure {
  string field_id = 1;
  uint32 code = 2; // Required1, TooShort2, TooLong3, InvalidSelection4, Rejected5.
}
message TypedExecuteResponse {
  uint32 status = 1; // Completed1, InvalidFields2, Failed3.
  repeated TypedFieldFailure failures = 2;
  // Unavailable1, Denied2, Cancelled3, Timeout4, Unsupported5, Failed6,
  // SchemaMismatch7, ResourceLimit8, ProtocolViolation9. No plugin text.
  uint32 failure_code = 3;
}

message ExecuteResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OK = 1;
    FAILED = 2;
    UNSUPPORTED = 3;
    // The action opened a page instead of finishing. `page_id` names it and
    // the host begins asking the plugin to draw (spec 32.2).
    SHOW_PAGE = 4;
  }
  Outcome outcome = 1;
  Error error = 2;
  // Set only with SHOW_PAGE. Identifies the page in every later
  // PageRequest, so one plugin may own several distinct pages.
  string page_id = 3;
}

// ---------------------------------------------------------------------------
// Configuration and events (spec 21.4, 14.6, 18.7)
// ---------------------------------------------------------------------------

message ConfigurationChange {
  map<string, string> values = 1;
  // True when `values` is the complete configuration state rather than a
  // delta; the host coalesces rapid edits into one complete publication.
  bool complete = 2;
}

message Event {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    FILESYSTEM = 1;
    NETWORK = 2;
    CONFIGURATION = 3;
    APPLICATIONS = 4;
    CUSTOM = 5;
  }
  Kind kind = 1;
  map<string, string> attributes = 2;
  uint64 flags = 3;
}

// ---------------------------------------------------------------------------
// Resources, logging, health, errors (spec 16.3, 24.3, 26.1)
// ---------------------------------------------------------------------------

message ResourceRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    ICON = 1;
    FILE = 2;
    CONFIGURATION = 3;
  }
  Kind kind = 1;
  string reference = 2;
}

message ResourceResponse {
  string reference = 1;
  bool found = 2;
  bytes content = 3;
  string media_type = 4;
  Error error = 5;
}

message LogRecord {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    ERROR = 1;
    WARN = 2;
    INFO = 3;
    DEBUG = 4;
    TRACE = 5;
  }
  Level level = 1;
  string message = 2;
  uint64 timestamp_ms = 3;
}

message HealthCheck {
  uint64 nonce = 1;
}

message HealthReport {
  uint64 nonce = 1;
  bool healthy = 2;
  uint64 memory_bytes = 3;
  uint32 queue_depth = 4;
  uint32 in_flight = 5;
  string detail = 6;
}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    PROTOCOL = 1;
    PLUGIN = 2;
    TIMEOUT = 3;
    CANCELLED = 4;
    RESOURCE = 5;
    UNSUPPORTED = 6;
  }
  Code code = 1;
  string message = 2;
  string detail = 3;
  uint64 request_id = 4;
}

// ---------------------------------------------------------------------------
// Flow control (spec 12.3, 12.4)
// ---------------------------------------------------------------------------

message FlowControl {
  // Additional result batches the plugin may send, added to its remaining
  // credit. A plugin that sends a batch with no credit commits a protocol
  // violation and is disconnected.
  uint32 credits = 1;
  // True while the host has stopped consuming; the plugin must pause emitting
  // even if it still holds credit.
  bool paused = 2;
}

message Shutdown {
  bool immediate = 1;
}

// ---------------------------------------------------------------------------
// Plugin-drawn pages (spec 32)
// ---------------------------------------------------------------------------

// Asks the plugin to draw one frame of a page it opened. Host-driven, exactly
// like SuggestRequest: a plugin never pushes a frame, so pages inherit the
// generation, deadline and cancellation discipline that already governs
// suggestions rather than needing a channel of their own.
message PageRequest {
  string page_id = 1;
  // Monotonic per page. A frame answering an older generation is dropped.
  uint64 generation = 2;
  // The area the page may draw in, in logical pixels.
  uint32 width = 3;
  uint32 height = 4;
  // Input since the previous frame, in the order it happened.
  repeated PageInput events = 5;
  // Whether the page currently holds the keyboard.
  bool focused = 6;
  // The host palette, so a page can match the launcher instead of guessing
  // at colours that a theme change would strand. 0xRRGGBBAA.
  uint32 colour_surface = 7;
  uint32 colour_text = 8;
  uint32 colour_accent = 9;
  uint32 colour_muted = 10;
}

message PageInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    OPENED = 1;
    POINTER_MOVED = 2;
    POINTER_PRESSED = 3;
    POINTER_RELEASED = 4;
    KEY_PRESSED = 5;
    TEXT_INPUT = 6;
    ACTIVATED = 7;
    FOCUS_CHANGED = 8;
    CLOSED = 9;
  }
  Kind kind = 1;
  float x = 2;
  float y = 3;
  // Named rather than numeric so the meaning survives an SDK version skew:
  // "Enter", "ArrowDown", "A".
  string key = 4;
  // Committed text only; the host resolves input-method composition first.
  string text = 5;
  // The node the event landed on, or 0 for none. The host hit-tests.
  uint32 node_id = 6;
  bool ctrl = 7;
  bool shift = 8;
  bool alt = 9;
}

// One frame of a page: either a flat display list drawn by the host or a web
// surface declaration. Plugin code never crosses this boundary. Plugin-drawn
// pixels cross only as the bounded raster an IMAGE node carries.
// Repeated occurrences of Envelope.page_frame merge, including their nested
// web declarations; splitting fields across fragments does not replace the
// earlier URL or hide a mixture of display-list nodes and a web surface.
message PageFrame {
  uint64 generation = 1;
  string title = 2;
  repeated PageNode nodes = 3;
  // The display-list node the plugin wants focused, or 0 to leave focus where
  // it is. Web frames must use 0: focus belongs to the document.
  uint32 focus_node = 4;
  // Ask for another display-list frame this many milliseconds from now even
  // without input. 0 leaves the display list static until the user acts.
  // The host clamps a display list's self-scheduled redraw to
  // MIN_PAGE_REDRAW_MS (16 ms), so a shorter period is raised rather than
  // honoured; frames answering input are not delayed. Web frames must use 0:
  // the engine owns their repainting, and nonzero web redraws are refused.
  uint32 redraw_after_ms = 5;
  // The plugin closing its own page.
  bool close = 6;
  // Set when the page is a web surface instead of a display list. The two
  // are exclusive and a frame carrying both is refused: the host either
  // draws the plugin's nodes or hands the page to an engine, and there is no
  // coherent screen in between. An older host that does not know this field
  // retains it as an unknown field and draws an empty display list, which is
  // the same nothing it would draw for a page it cannot render.
  PageWebSurface web = 7;
}

// A page the host lends to a web engine. The plugin names an address; it
// never sees the pixels or the document, which is what keeps a web surface
// from becoming a way to read the user's screen. The engine itself runs in
// crikey-web-host, and the messages below carry the surface's traffic.
message PageWebSurface {
  // A stated address must be an absolute HTTP(S) URL with a non-empty host,
  // whitespace-free authority and no control characters, at most 8 KiB.
  // Empty on a later frame means "stay where you are"; the host refuses an
  // empty first navigation rather than opening a blank document.
  string url = 1;
  // Defaults to ephemeral. The choice cannot change while the surface is
  // open; later stay/navigation frames must repeat the original mode.
  WebStorageMode storage = 2;
}

message PageNode {
  enum Shape {
    SHAPE_UNSPECIFIED = 0;
    RECT = 1;
    TEXT = 2;
    LINE = 3;
    CIRCLE = 4;
    IMAGE = 5;
  }
  // Finished pixels for an IMAGE node. Raw RGBA8 and nothing else: the host
  // parses no image format, because a decoder is an attack surface and a
  // compressed byte count says nothing about the allocation behind it. A
  // plugin holding a PNG decodes it in its own process.
  message Image {
    // Pixels of the raster, not of the node it is drawn into; the host
    // scales. 1 to 1024 a side.
    uint32 pixel_width = 1;
    uint32 pixel_height = 2;
    // Exactly pixel_width * pixel_height * 4 bytes, row-major, no padding,
    // non-premultiplied. At most 1 MiB per node and 4 MiB per frame.
    bytes rgba = 3;
  }
  // What the node *is*, as opposed to what it looks like. This is the whole
  // accessibility contract: a painted glyph is not an accessible name, so a
  // node left ROLE_UNSPECIFIED is decoration to assistive technology.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    BUTTON = 1;
    LABEL = 2;
    HEADING = 3;
    TEXT_FIELD = 4;
    CHECKBOX = 5;
  }
  Shape shape = 1;
  // Logical pixels relative to the page's own top-left corner. A plugin
  // never learns where its page sits on screen, and the host clips.
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  // 0xRRGGBBAA. `fill` is the glyph colour for TEXT.
  uint32 fill = 6;
  uint32 stroke = 7;
  float stroke_width = 8;
  float rounding = 9;
  string text = 10;
  // 0 takes the host's body size, so a page inherits launcher typography.
  float text_size = 11;
  Role role = 12;
  // The accessible name; falls back to `text` when empty.
  string label = 13;
  // Non-zero makes the node addressable: input events name it, and only an
  // addressable interactive node joins the focus ring.
  uint32 node_id = 14;
  // Position in the Tab ring; ties break by emission order.
  uint32 focus_order = 15;
  bool checked = 16;
  // Required by IMAGE and refused on every other shape this schema defines.
  // A shape a host does not recognise decodes to SHAPE_UNSPECIFIED, and that
  // host discards the raster instead of refusing the frame, so a later shape
  // may reuse this field without breaking older hosts. Carried inline
  // rather than as a path: a reference would mean the host opening a file a
  // plugin named, for no gain when the plugin can already read its own
  // package.
  Image image = 17;
}

// ---------------------------------------------------------------------------
// Web surface (spec 32.x)
// ---------------------------------------------------------------------------
//
// A plugin page is either a display list or a web surface, never both, and at
// most one web surface is live at a time. Every message below travels between
// the launcher and crikey-web-host; a plugin never sends or receives one.
//
// surface_id is field 1 everywhere so a late frame from a surface the user
// already closed is discarded on arrival rather than drawn over its successor.

// The keyboard modifiers a RawInput carries, as a bit mask. Meta and the lock
// keys are included because a web page observes them: Ctrl+Click is not
// Meta+Click, and a page reading `getModifierState("CapsLock")` gets a wrong
// answer from a mask that cannot express it.
enum WebModifier {
  WEB_MODIFIER_NONE = 0;
  WEB_MODIFIER_SHIFT = 1;
  WEB_MODIFIER_CONTROL = 2;
  WEB_MODIFIER_ALT = 4;
  WEB_MODIFIER_META = 8;
  WEB_MODIFIER_CAPS_LOCK = 16;
  WEB_MODIFIER_NUM_LOCK = 32;
}

// How long a surface's cookies, local storage and caches live. Chosen by the
// owning plugin and permission-gated by the host, so a page with no storage
// permission cannot ask for PERSISTENT and get it. Top-level because both
// halves of the journey name it: the plugin declares it on PageFrame.web and
// the launcher passes it on in OpenSurface.
enum WebStorageMode {
  WEB_STORAGE_MODE_UNSPECIFIED = 0;
  // In-memory only; everything dies with the surface. Also what an
  // unspecified mode means, so the safe answer is the one a silence gets.
  WEB_STORAGE_MODE_EPHEMERAL = 1;
  // A directory the host owns, keyed to the plugin.
  WEB_STORAGE_MODE_PERSISTENT = 2;
}

message OpenSurface {
  uint64 surface_id = 1;
  // Device pixels of the surface, which is also the frame size the web host
  // will send back.
  uint32 pixel_width = 2;
  uint32 pixel_height = 3;
  string url = 4;
  WebStorageMode storage_mode = 5;
}

// One input event, forwarded to the engine unfiltered except for the keys the
// host keeps: Escape exits the page and never arrives here, while Tab does
// arrive, because a web page owns its own focus ring.
message RawInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KEY_DOWN = 1;
    KEY_UP = 2;
    POINTER_MOVE = 3;
    POINTER_DOWN = 4;
    POINTER_UP = 5;
    SCROLL = 6;
    FOCUS_IN = 7;
    FOCUS_OUT = 8;
  }
  uint64 surface_id = 1;
  Kind kind = 2;
  // Milliseconds on the launcher's clock; the engine only needs monotonicity.
  uint64 timestamp_ms = 3;
  // Device pixels relative to the surface's top-left corner.
  float x = 4;
  float y = 5;
  // An X keysym. Zero produces an empty `key` in the page, so a synthesised
  // event must carry one.
  uint32 keysym = 6;
  // An XKB hardware keycode on the supported Linux WPE path: Linux evdev
  // scancode + 8, not the unadjusted scancode. Zero means unavailable and
  // produces `Unidentified` in the page. Carried alongside the keysym rather
  // than derived from it, so physical key identity survives keyboard layouts.
  uint32 hardware_keycode = 7;
  bool repeat = 8;
  // A bit mask of WebModifier values.
  uint32 modifiers = 9;
  // Normalized launcher button numbering: LEFT = 1, MIDDLE = 2, RIGHT = 3,
  // 0 for an event that names no button. The web host translates this to the
  // engine ABI. Carried as an integer rather than an enum because a mouse
  // with more buttons is ordinary hardware.
  uint32 button = 10;
  // 1 for a single click, 2 for a double, and so on.
  uint32 press_count = 11;
  float delta_x = 12;
  float delta_y = 13;
  // A high-resolution device (touchpad, precision wheel) rather than a
  // notched wheel, which the page uses to decide whether to animate.
  bool precise = 14;
  // The end of a scroll gesture: fingers lifted, no more deltas coming.
  bool stop = 15;
}

// Input-method traffic, already normalised by the launcher.
//
// The launcher converts winit's UTF-8 byte cursor offsets to Unicode scalar
// offsets before sending. The web host converts those scalar offsets to
// WebKit's UTF-16 code units; a supplementary character counts as one on the
// wire and two in WebKit. An empty preedit immediately before a commit must
// not end the composition ahead of the commit; the host bridges that sequence.
// Correction of already-committed text (delete-surrounding) is not part of
// version 1.
message ImeEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PREEDIT = 1;
    COMMIT = 2;
  }
  uint64 surface_id = 1;
  Kind kind = 2;
  string text = 3;
  // Unicode scalar offsets into `text`, valid only when has_cursor is set.
  // An absent cursor is winit's `None`, not the same as a cursor at 0.
  uint32 cursor_begin_chars = 4;
  uint32 cursor_end_chars = 5;
  bool has_cursor = 6;
}

message Navigate {
  uint64 surface_id = 1;
  string url = 2;
}

message Resize {
  uint64 surface_id = 1;
  uint32 pixel_width = 2;
  uint32 pixel_height = 3;
}

message CloseSurface {
  uint64 surface_id = 1;
  // Recorded in the host log; not shown to the user.
  string reason = 2;
}

// One rendered frame of the surface. Raw RGBA8 and nothing else, converted
// from the engine's BGRA in the web host so the launcher never touches a
// channel order it did not ask for.
//
// This is deliberately not a PageNode.Image: the MAX_PAGE_IMAGE_* caps are a
// plugin-facing contract about what a display list may draw, and a web
// surface is neither drawn by a plugin nor bounded by the same numbers. Its
// own caps are MAX_WEB_FRAME_BYTES (2 MiB) and MAX_WEB_FRAME_EDGE (4096).
message WebFrame {
  uint64 surface_id = 1;
  // Increases with every frame. The launcher drops a frame older than the one
  // it has already presented.
  uint64 generation = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
  // Exactly pixel_width * pixel_height * 4 bytes, row-major, no padding,
  // premultiplied alpha, at most MAX_WEB_FRAME_BYTES.
  bytes rgba8 = 5;
}

// Where the caret is inside the surface, so the launcher can place the
// candidate window with Window::set_ime_cursor_area. Without it the IME's
// candidates sit at the window's bottom-left, ignoring the text being typed.
message CaretArea {
  uint64 surface_id = 1;
  // Device pixels relative to the surface's top-left corner.
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message LoadState {
  enum State {
    STATE_UNSPECIFIED = 0;
    STARTED = 1;
    REDIRECTED = 2;
    COMMITTED = 3;
    FINISHED = 4;
    FAILED = 5;
  }
  uint64 surface_id = 1;
  State state = 2;
  string url = 3;
  // Populated only for FAILED.
  string failure = 4;
  bool can_go_back = 5;
  bool can_go_forward = 6;
  string title = 7;
}

// The surface is gone and no further frames are coming. The reason is
// load-bearing: the host paints an in-place panel naming the plugin when a
// surface was killed for exceeding its memory ceiling, and must not mention
// memory for an ordinary crash.
message Gone {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The host or the plugin asked for the close.
    CLOSED = 1;
    // Our own cgroup limit killed it: oom > 0 in the surface's own
    // memory.events.local.
    MEMORY_LIMIT = 2;
    // The web process died without our limit firing.
    CRASHED = 3;
    // The surface never came up.
    STARTUP_FAILED = 4;
    // The web host sent something the launcher refused.
    PROTOCOL_VIOLATION = 5;
  }
  uint64 surface_id = 1;
  Reason reason = 2;
  string detail = 3;
}
