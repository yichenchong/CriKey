[[api]]
module = "keypirinha"
symbol = "Match"
status = "partial"
notes = "The enum is accepted and the Python shim serializes it into the reply's `match` field, but it never becomes usable metadata: the Rust decoder (`worker.rs::decode_outcome`) reads only `items`, and `LegacyOutcome::Suggestions` carries no policy, so the value is discarded on arrival. A published batch is then passed through without any host matching — `lifecycle.rs` truncates it to the publication cap, `legacy_provider.rs` delivers it unchanged, and the query pipeline only orders by `score_hint`. No requested method causes the host to filter or re-match the list, so Match.ANY happens to be the effective behaviour in every case."

[[api]]
module = "keypirinha"
symbol = "Sort"
status = "partial"
notes = "Accepted and transmitted as the reply's `sort` field, then dropped on the same path as keypirinha.Match: the host never reads it, so no requested order is applied and the label and score policies are not honoured. Sort.NONE is a special case that does hold: the legacy decoder gives every item `score_hint: 0` (`worker.rs:1618`) and the pipeline orders with a STABLE `sort_by_key` on that field (`query_pipeline.rs:340`), so a batch keeps its published order — incidentally, because every legacy item ties, not because the request was read. A plugin must not depend on it: giving legacy items a real score hint would silently reorder them."

[[api]]
module = "keypirinha"
symbol = "Events"
status = "full"
notes = "Bit values mirror the host event flags bit for bit; the shim and crikey-legacy-compat share the numbering as an ABI."

[[api]]
module = "keypirinha"
symbol = "Settings"
status = "full"

[[api]]
module = "keypirinha"
symbol = "CatalogItem"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action"
status = "behavioural-difference"
notes = "Keypirinha hands on_execute a second catalog item describing the chosen action; CriKey hands a keypirinha.Action (or None for the default action) whose name()/label()/short_desc() map onto crikey_core::Action. A plugin that called item accessors on the action argument sees only these three."

[[api]]
module = "keypirinha"
symbol = "Action.name"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action.label"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action.short_desc"
status = "full"

[[api]]
module = "keypirinha"
symbol = "name"
status = "behavioural-difference"
notes = "Returns \"CriKey\". Spec 14.13 forbids presenting this layer as a Keypirinha component, so a plugin that string-matches the product name sees a different value."

[[api]]
module = "keypirinha"
symbol = "version"
status = "behavioural-difference"
notes = "Returns CriKey's version tuple, not a Keypirinha release number, so a plugin that gates a feature on a Keypirinha version comparison will conclude it is running on an older host."

[[api]]
module = "keypirinha"
symbol = "version_string"
status = "behavioural-difference"
notes = "Dotted CriKey version, never a Keypirinha version string (spec 14.13)."

[[api]]
module = "keypirinha"
symbol = "should_terminate"
status = "full"
notes = "Level-triggered and read afresh on every call; the optional delay waits on the host's own cancellation event where one exists and otherwise polls in short slices, so a cooperative plugin neither spins nor goes deaf to cancellation (spec 7.1, 14.5)."

[[api]]
module = "keypirinha"
symbol = "user_config_dir"
status = "behavioural-difference"
notes = "Answers CriKey's own per-user configuration directory, resolved by the launcher from the platform convention (XDG on Linux, %APPDATA% on Windows, ~/Library on macOS) and handed to the worker. It is deliberately not a Keypirinha installation path: a legacy package running here is configured by this launcher (spec 14.13). A worker the launcher did not tell reports HostUnavailableError rather than guessing a path."

[[api]]
module = "keypirinha"
symbol = "installed_package_dir"
status = "behavioural-difference"
notes = "Answers CriKey's installed-legacy-plugin directory rather than a Keypirinha InstalledPackage folder, and the packages in it are CriKey package directories. Same resolution and same honest refusal as user_config_dir."

[[api]]
module = "keypirinha"
symbol = "package_cache_dir"
status = "behavioural-difference"
notes = "Answers the launcher's legacy cache root, which is also where archive packages are extracted; Plugin.get_package_cache_path remains the per-package subdirectory. Not a Keypirinha cache path. Same resolution and same honest refusal as user_config_dir."

# ---------------------------------------------------------------------------
# keypirinha.Settings
# ---------------------------------------------------------------------------

[[api]]
module = "keypirinha"
symbol = "Settings.DEFAULT_SECTION"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Settings.get"
status = "behavioural-difference"
notes = "Returns the literal value. Python configparser's extended interpolation (`${section:key}` and `${env:VARIABLE}`) is not implemented, so references that resolve in a legacy configuration remain unresolved text here."

[[api]]
module = "keypirinha"
symbol = "Settings.get_bool"
status = "behavioural-difference"
notes = "Coerces the stored value but does not perform Python configparser extended interpolation first; `${section:key}` and `${env:VARIABLE}` references therefore do not resolve before boolean parsing."

[[api]]
module = "keypirinha"
symbol = "Settings.get_int"
status = "behavioural-difference"
notes = "Coerces the stored value but does not perform Python configparser extended interpolation first; `${section:key}` and `${env:VARIABLE}` references therefore do not resolve before integer parsing."

[[api]]
module = "keypirinha"
symbol = "Settings.get_float"
status = "behavioural-difference"
notes = "Coerces the stored value but does not perform Python configparser extended interpolation first; `${section:key}` and `${env:VARIABLE}` references therefore do not resolve before float parsing."

[[api]]
module = "keypirinha"
symbol = "Settings.sections"
status = "behavioural-difference"
notes = "Sorted first-seen spellings rather than file order, so a plugin that relied on configuration order to break a tie must sort explicitly. Sorting is deliberate: it makes a plugin's own catalog deterministic across reloads."

[[api]]
module = "keypirinha"
symbol = "Settings.keys"
status = "behavioural-difference"
notes = "Sorted first-seen spellings rather than file order, for the same determinism reason as Settings.sections."

[[api]]
module = "keypirinha"
symbol = "Settings.has"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Settings.get_multiline"
status = "behavioural-difference"
notes = "Splits the stored value on line breaks, stripping each line and dropping blank ones unless keep_empty_lines is set; an absent key with no fallback answers an empty list. Extended interpolation is not performed first, so `${section:key}` and `${env:VARIABLE}` references remain unresolved text in each line."

[[api]]
module = "keypirinha"
symbol = "Settings.get_stripped"
status = "behavioural-difference"
notes = "Strips whitespace and one matching quote pair from the stored value. Extended interpolation is not performed first, so `${section:key}` and `${env:VARIABLE}` references remain unresolved text."

[[api]]
module = "keypirinha"
symbol = "Settings.get_enum"
status = "behavioural-difference"
notes = "Matches the stored value against the accepted spellings, ASCII-case-insensitively unless case_sensitive is set, and returns the *accepted* spelling so a plugin can compare it against its own literals. An unaccepted value raises SettingsError attributed to the section and key. Extended interpolation is not performed first, so `${section:key}` and `${env:VARIABLE}` references remain unresolved text and would therefore fail to match."

[[api]]
module = "keypirinha"
symbol = "Settings.get_mapped"
status = "behavioural-difference"
notes = "Translates the stored value through the supplied map, ASCII-case-insensitively unless case_sensitive is set; a value absent from the map raises SettingsError attributed to the section and key. Extended interpolation is not performed first, so `${section:key}` and `${env:VARIABLE}` references remain unresolved text and would therefore fail to match."

