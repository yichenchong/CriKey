symbol = "read_link"
status = "windows-only"
notes = "The legacy import path is keypirinha_util.read_link, but its operation is owned by this explicit platform interface. It is backed by the Win32 shell link interfaces (IShellLinkW plus IPersistFile). Off Windows the alias raises keypirinha.HostUnavailableError: resolving a shortcut runs the shell's own link tracking, and a hand-written .lnk parser elsewhere would answer a different question under the same name (spec 2.3). A shortcut naming a virtual shell folder rather than a file is also refused rather than reported as an empty path."

[[api]]
module = "keypirinha_wintypes"
symbol = "shell_known_folder_path"
status = "windows-only"
notes = "The legacy import path is keypirinha_util.shell_known_folder_path, but its operation is owned by this explicit platform interface. It is backed by SHGetKnownFolderPath. Off Windows the alias raises keypirinha.HostUnavailableError: there is no known-folder registry to consult and no defensible mapping onto XDG or ~/Library, so a nearest match would send a plugin's writes somewhere the user never agreed to. keypirinha.user_config_dir and its siblings are the portable answer."

[[api]]
module = "keypirinha_wintypes"
symbol = "*"
status = "windows-only"
notes = "Catch-all for every Win32 entry point in the module - kernel32, user32, shell32, ole32, declare_func and GUID. Each resolves only against Win32 and raises WindowsOnlyError elsewhere, so none of them may ever be reported as portable (acceptance 31.31). One row rather than an enumeration, because the set is defined by the shim's WINDOWS_ONLY_SYMBOLS and would otherwise drift."
