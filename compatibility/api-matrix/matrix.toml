# Legacy API compatibility matrix (spec 14.10).
#
# Version-controlled AND tested: `crates/crikey-legacy-compat/tests/compatibility_matrix.rs`
# loads this file, cross-checks it against the symbols the shim under
# `crates/crikey-legacy-compat/python/` actually defines, and fails if a row
# overstates the layer, omits a documented API, or leaves a caveat unexplained.
#
# status = full | behavioural-difference | windows-only | partial | unsupported | planned
#   full                    - the documented behaviour, reproduced.
#   behavioural-difference  - present and usable, but observably different. `notes` mandatory.
#   windows-only            - backed by Win32; unavailable on other platforms.
#   partial                 - present, with a documented gap. `notes` mandatory.
#   unsupported             - deliberately not reproduced (spec 14.12 non-goal).
#   planned                 - documented Keypirinha API this milestone does not ship.
#
# `symbol = "*"` is a literal catch-all row for the rest of a module, not a
# glob: an exact row always wins and no pattern matching is performed.

matrix-version = 1

# ---------------------------------------------------------------------------
# keypirinha - module level (spec 14.2, 14.4)
# ---------------------------------------------------------------------------

[[api]]
module = "keypirinha"
symbol = "KeypirinhaError"
status = "full"

[[api]]
module = "keypirinha"
symbol = "UndocumentedApiError"
status = "full"
notes = "CriKey addition (spec 14.12): a reach for an undocumented internal raises this instead of a bare AttributeError, so the diagnostic is attributable to the plugin."

[[api]]
module = "keypirinha"
symbol = "InvalidItemError"
status = "full"

[[api]]
module = "keypirinha"
symbol = "SettingsError"
status = "full"

[[api]]
module = "keypirinha"
symbol = "HostUnavailableError"
status = "full"
notes = "CriKey addition: an optional host capability the installed host does not implement is refused by name rather than failing inside the shim."

[[api]]
module = "keypirinha"
symbol = "ItemCategory"
status = "full"

[[api]]
module = "keypirinha"
symbol = "ItemArgsHint"
status = "full"

[[api]]
module = "keypirinha"
symbol = "ItemHitHint"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Match"
status = "behavioural-difference"
notes = "The requested matching method is honoured, but matching is performed by CriKey's own matcher: which items match is the same, the relative order of similarly-scored items is not. Spec 14.12 exempts exact reproduction of undocumented ranking behaviour."

[[api]]
module = "keypirinha"
symbol = "Sort"
status = "behavioural-difference"
notes = "Label orders are exact. Score-based orders follow CriKey's ranking, so items the legacy scorer would have separated can tie and appear in a different order."

[[api]]
module = "keypirinha"
symbol = "Events"
status = "full"
notes = "Bit values mirror the host event flags bit for bit; the shim and crikey-legacy-compat share the numbering as an ABI."

[[api]]
module = "keypirinha"
symbol = "Settings"
status = "full"

[[api]]
module = "keypirinha"
symbol = "CatalogItem"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action"
status = "behavioural-difference"
notes = "Keypirinha hands on_execute a second catalog item describing the chosen action; CriKey hands a keypirinha.Action (or None for the default action) whose name()/label()/short_desc() map onto crikey_core::Action. A plugin that called item accessors on the action argument sees only these three."

[[api]]
module = "keypirinha"
symbol = "Action.name"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action.label"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Action.short_desc"
status = "full"

[[api]]
module = "keypirinha"
symbol = "name"
status = "behavioural-difference"
notes = "Returns \"CriKey\". Spec 14.13 forbids presenting this layer as a Keypirinha component, so a plugin that string-matches the product name sees a different value."

[[api]]
module = "keypirinha"
symbol = "version"
status = "behavioural-difference"
notes = "Returns CriKey's version tuple, not a Keypirinha release number, so a plugin that gates a feature on a Keypirinha version comparison will conclude it is running on an older host."

[[api]]
module = "keypirinha"
symbol = "version_string"
status = "behavioural-difference"
notes = "Dotted CriKey version, never a Keypirinha version string (spec 14.13)."

[[api]]
module = "keypirinha"
symbol = "should_terminate"
status = "full"
notes = "Level-triggered and read afresh on every call; the optional delay waits on the host's own cancellation event where one exists and otherwise polls in short slices, so a cooperative plugin neither spins nor goes deaf to cancellation (spec 7.1, 14.5)."

[[api]]
module = "keypirinha"
symbol = "user_config_dir"
status = "planned"
notes = "Legacy configuration reaches plugins through Plugin.load_settings in M3; the module-level directory helpers land with the legacy configuration layout."

[[api]]
module = "keypirinha"
symbol = "installed_package_dir"
status = "planned"
notes = "Plugin.package_full_path covers the only documented use M3 needs; the installation-wide directory is deferred."

[[api]]
module = "keypirinha"
symbol = "package_cache_dir"
status = "planned"
notes = "Plugin.get_package_cache_path covers the per-plugin case; the installation-wide cache directory is deferred."

