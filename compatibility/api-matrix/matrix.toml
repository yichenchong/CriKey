[[api]]
module = "keypirinha"
symbol = "Plugin.set_actions"
status = "partial"
notes = "Registers one category's alternate actions; the launcher offers them on every row of that category and hands the chosen keypirinha.Action to on_execute. Two documented differences: the registration is refused above 32 actions per category and 64 categories rather than being unbounded, and the name \"legacy.execute\" is reserved by the host for the default action, so a plugin action spelled that way is refused instead of silently shadowing Enter."

[[api]]
module = "keypirinha"
symbol = "Plugin.create_action"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.load_icon"
status = "partial"
notes = "Package-relative paths and the documented res://Package/file form both resolve, against the package that loaded the plugin. Three documented limits: a source naming another package is refused, because a legacy icon is resolved against its own plugin's directory and nothing can reach another's; a source above 256 KiB is refused rather than truncated; and when several sources are given only the first is resolved, because the host decodes one file at one size."

[[api]]
module = "keypirinha"
symbol = "Plugin.set_default_icon"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.create_error_item"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.find_resources"
status = "partial"
notes = "Enumerates the package's own files, sorted and package-relative. Matching is segment by segment, so \"*\" stops at a directory boundary and \"**\" is the way to span depth; a pattern that is absolute, holds \"..\" or holds a backslash is refused rather than normalised, and a walk that would report more than 4096 names or examine more than 65536 entries is refused rather than truncated."

# ---------------------------------------------------------------------------
# keypirinha_util (spec 14.2)
# ---------------------------------------------------------------------------

[[api]]
module = "keypirinha_util"
symbol = "UnavailableError"
status = "full"
notes = "CriKey addition and the honest-unavailability channel itself: subclasses RuntimeError, never AttributeError or OSError, because those are routinely swallowed and would turn a refusal into a silent no-op. Carries .operation, .platform and .reason."

[[api]]
module = "keypirinha_util"
symbol = "ScanFlags"
status = "full"

[[api]]
module = "keypirinha_util"
symbol = "cmdline_split"
status = "full"
notes = "Implements the documented CommandLineToArgvW rules as a pure string function on every platform, so unchanged plugins parse identically off Windows."

[[api]]
module = "keypirinha_util"
symbol = "cmdline_quote"
status = "full"
notes = "The exact inverse of cmdline_split, including empty arguments, embedded quotes and trailing backslashes."

[[api]]
module = "keypirinha_util"
symbol = "expand_variables"
status = "behavioural-difference"
notes = "Windows %VAR% syntax with case-insensitive lookup is implemented on every platform, including hosts whose real environment is case-sensitive, so %path% and %PATH% resolve to the same value here while the surrounding OS would treat them as two variables. Unknown variables are left verbatim rather than emptied, and %% escapes a literal percent."

[[api]]
module = "keypirinha_util"
symbol = "scan_directory"
status = "behavioural-difference"
notes = "Returns sorted, base-relative paths using the host separator, so results are deterministic where Keypirinha's directory order was not. Hidden and system filtering is a Win32 file-attribute concept and cannot be reproduced off Windows, where only the name pattern and the FILES/FOLDERS/RECURSIVE flags apply."

[[api]]
module = "keypirinha_util"
symbol = "desktop_available"
status = "full"
notes = "CriKey addition: lets a plugin ask whether the desktop-touching helpers can work instead of provoking UnavailableError to find out."

[[api]]
module = "keypirinha_util"
symbol = "set_clipboard"
status = "partial"
notes = "Needs a desktop session. On a headless host it raises keypirinha_util.UnavailableError naming the operation and platform rather than pretending to have copied anything."

[[api]]
module = "keypirinha_util"
symbol = "get_clipboard"
status = "partial"
notes = "Needs a desktop session; raises keypirinha_util.UnavailableError on a headless host instead of returning an empty string, which a plugin could not tell from an empty clipboard."

[[api]]
module = "keypirinha_util"
symbol = "open_url"
status = "partial"
notes = "Needs a desktop session with a registered browser; raises keypirinha_util.UnavailableError on a headless host."

[[api]]
module = "keypirinha_util"
symbol = "shell_execute"
status = "partial"
notes = "Launches through the platform backend. Win32-specific arguments are accepted for source compatibility but only honoured on Windows: the `verb` (\"runas\") and `show` window codes have no equivalent elsewhere. Raises keypirinha_util.UnavailableError when no desktop session can start a program."

[[api]]
module = "keypirinha_util"
symbol = "explore_file"
status = "partial"
notes = "Needs a desktop session with a file manager; raises keypirinha_util.UnavailableError on a headless host."

[[api]]
module = "keypirinha_util"
symbol = "fuzzy_score"
status = "unsupported"
notes = "Spec 14.12 makes exact reproduction of the undocumented legacy ranking a non-goal. Exposing a different score under the same name would silently reorder every plugin that filters on it, so the name is refused instead; plugins should let the host match and sort."

[[api]]
module = "keypirinha_util"
symbol = "chardet_open"
status = "behavioural-difference"
notes = "Opens the file in the encoding decode_bytes would choose. No statistical charset detector is bundled — every usable one is a third-party package the layer refuses to require — so detection is a documented ladder of evidence: byte-order mark, then whole-input UTF-8 validation, then Windows-1252, then Latin-1. Detection reads at most the first megabyte. Binary modes are refused with ValueError rather than silently opened undetected."

[[api]]
module = "keypirinha_util"
symbol = "decode_bytes"
status = "behavioural-difference"
notes = "Same ladder as chardet_open: byte-order mark, whole-input UTF-8, Windows-1252, then Latin-1, which cannot fail. The last two rungs are guesses and the docstring says so; text a statistical detector would have identified as some other single-byte encoding is decoded as cp1252 here."

[[api]]
module = "keypirinha_util"
symbol = "kwargs_encode"
status = "behavioural-difference"
notes = "Round-trips exactly with kwargs_decode for every basic bool, int, float and string value, including strings containing the separators: pairs are `name=value` joined by `&`, with `\\\\`, `&` and `=` backslash-escaped inside both, and emitted in sorted name order so an item target is stable. Type tags preserve scalar types. Keypirinha's own packing format is undocumented, so a string produced by Keypirinha is not guaranteed to decode here."
[[api]]
module = "keypirinha_util"
symbol = "kwargs_decode"
status = "behavioural-difference"
notes = "The exact inverse of this layer's kwargs_encode. Text that encode could not have produced — a pair with no unescaped `=`, an empty or repeated name, a trailing lone escape — raises ValueError rather than being given an invented reading. See kwargs_encode for the format difference from Keypirinha."

[[api]]
module = "keypirinha_util"
symbol = "execute_default_action"
status = "partial"
notes = "The item's default action is performed by the launcher, over a host request the worker blocks on, gated by the same `process` permission as every other host-mediated launch and run in the launcher's process group so it survives a worker restart. A refusal (no permission, an unusable target, no answer) raises HostUnavailableError in the plugin. The partial part is the `action` argument: a plugin-defined secondary action means nothing to the launcher, so the call answers False and leaves it to the plugin, which is what its own on_execute is for."

[[api]]
module = "keypirinha_util"
symbol = "web_browser_command"
status = "behavioural-difference"
notes = "Returns an argv list rather than a Windows command-line string; cmdline_quote turns one into the other for callers that need it. The browser is resolved from BROWSER (POSIX convention, `%s` substituted) and then from a list of known browsers on PATH, not from a Windows registry association. private_mode and new_window are honoured only for browsers whose flags this layer knows and are refused with UnavailableError for any other, because opening an ordinary window for a caller who asked for a private one is a privacy failure, not a graceful degradation."


