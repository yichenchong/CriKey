# ---------------------------------------------------------------------------

[[api]]
module = "keypirinha"
symbol = "Plugin.id"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.friendly_name"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.package_full_name"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.on_start"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.on_catalog"
status = "full"
notes = "Each rebuild is a complete replacement (spec 14.8)."

[[api]]
module = "keypirinha"
symbol = "Plugin.on_suggest"
status = "behavioural-difference"
notes = "Under legacy-strict scheduling a superseded query is cancelled through the obsolete-work manager instead of being debounced (spec 14.5), so a long-running on_suggest observes should_terminate() turning true more often than under Keypirinha, and its late results are discarded by generation rather than displayed."

[[api]]
module = "keypirinha"
symbol = "Plugin.on_execute"
status = "behavioural-difference"
notes = "The second argument is a keypirinha.Action or None, not an action catalog item; see the keypirinha.Action row."

[[api]]
module = "keypirinha"
symbol = "Plugin.on_activated"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.on_deactivated"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.on_events"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.create_item"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.set_catalog"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.merge_catalog"
status = "full"
notes = "The host performs the merge; the shim publishes only the items this call contributed, which keeps a repeated rebuild linear instead of quadratic."

[[api]]
module = "keypirinha"
symbol = "Plugin.set_suggestions"
status = "behavioural-difference"
notes = "Each call publishes one complete replacement and the newest call within a callback wins, so a plugin that called it repeatedly to append to a growing list now shows only its final list. The published list is snapshotted, so mutating the plugin's own list afterwards changes nothing."

[[api]]
module = "keypirinha"
symbol = "Plugin.should_terminate"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.load_settings"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Plugin.package_full_path"
status = "full"

[[api]]
