status = "full"

[[api]]
module = "keypirinha"
symbol = "Settings.get_float"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Settings.sections"
status = "behavioural-difference"
notes = "Sorted first-seen spellings rather than file order, so a plugin that relied on configuration order to break a tie must sort explicitly. Sorting is deliberate: it makes a plugin's own catalog deterministic across reloads."

[[api]]
module = "keypirinha"
symbol = "Settings.keys"
status = "behavioural-difference"
notes = "Sorted first-seen spellings rather than file order, for the same determinism reason as Settings.sections."

[[api]]
module = "keypirinha"
symbol = "Settings.has"
status = "full"

[[api]]
module = "keypirinha"
symbol = "Settings.get_multiline"
status = "planned"
notes = "Widely used by published packages; not shipped in M3, so a plugin calling it raises AttributeError. Tracked as a one-line source workaround (get + splitlines)."

[[api]]
module = "keypirinha"
symbol = "Settings.get_stripped"
status = "planned"
notes = "Not shipped in M3. Equivalent to get() plus str.strip() and an unquote step, so it is a documented gap rather than a behavioural one."

[[api]]
module = "keypirinha"
symbol = "Settings.get_enum"
status = "planned"

[[api]]
module = "keypirinha"
symbol = "Settings.get_mapped"
status = "planned"

