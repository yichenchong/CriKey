; Keypirinha-style package configuration (spec 14.3). The loader reports this
; file as a package resource; reading it is LegacySettings' job (src/config.rs).
;
; This fixture takes no tunable input at all. Everything it publishes is fixed
; by the module and by what is committed beside it, which is what lets a test
; assert exact labels, exact resource names and an exact action name.

[main]
; Package-relative icon the plugin loads and sets as its default. Named here as
; well as in the module so the icon is visible as package data, not only as a
; string inside Python.
icon = icons/badge.png

[diagnostics]
; This fixture breaks no scheduling rule: it must pass every check, exactly as
; the `well-behaved` control does.
expected_verdict = pass
