; Keypirinha-style package configuration (spec 14.3), reported by the loader as
; a package resource.
;
; Note what is NOT configurable here: whether the plugin polls
; should_terminate(). The misbehaviour this fixture exists to demonstrate is
; written into the module and cannot be switched off, because a defect behind a
; flag tests the flag (spec 9.2, acceptance 31.17).

[main]
; How long "late" is, in loop iterations rather than in milliseconds. The plugin
; clamps this to MAX_BUSY_STEPS, so the fixture answers late and always answers.
busy_steps = 2000000

[diagnostics]
; The single check this package is expected to fail, recorded so a maintainer
; reading the directory knows the failing run is the intended result.
expected_verdict = fail
expected_failing_check = should_terminate_observed
