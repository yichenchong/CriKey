; Keypirinha-style package configuration (spec 14.3), reported by the loader as
; a package resource.
;
; A Windows-only dependency is a portability fact, not a conformance failure
; (acceptance 31.31): this package passes every scheduling check on every host
; and is still never presented as cross-platform.

[main]
; Declared for the reader's benefit; the layer detects the dependency from the
; module's `import keypirinha_wintypes`, never from a self-report, because a
; package could omit or lie about a declaration and the report would be wrong
; in the direction that matters.
requires_win32 = yes

[win32]
; The system metric the guarded branch reads. SM_CXSCREEN.
system_metric = 0

[diagnostics]
; `incomplete`, not `fail`: nothing broke, but this host could not look
; everywhere, and a green tick meaning "we did not look" is the plausible lie
; the roadmap forbids.
expected_verdict_on_windows = pass
expected_verdict_elsewhere = incomplete
expected_unavailable_check = win32_entry_points_operational
