; Keypirinha-style package configuration (spec 14.3). The loader reports this
; file as a package resource; reading it is LegacySettings' job (src/config.rs).
;
; Every value here is a constant, never a duration: the fixture suite is diffed
; between releases, so a setting that could make a run take longer would make
; two runs differ in the only dimension that matters (spec 26.3).

[main]
; Iterations of the cooperative work loop in on_suggest. The plugin clamps this
; to MAX_SUGGEST_STEPS, so editing it can slow a conformance run down but can
; never hang one.
suggest_steps = 512

; Package-relative resource the catalog labels are read from. Named here rather
; than only in the module so the module/resource split is visible from the
; configuration too.
catalog_resource = data/catalog.txt

[diagnostics]
; This fixture is the control: it is expected to pass every check, so there is
; nothing for it to explain.
expected_verdict = pass
