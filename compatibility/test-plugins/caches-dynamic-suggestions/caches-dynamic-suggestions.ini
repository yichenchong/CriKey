; Keypirinha-style package configuration (spec 14.3), reported by the loader as
; a package resource.
;
; There is deliberately no `cache_enabled` key. Whether the plugin caches is the
; defect under test and is written into the module unconditionally; only the
; *bound* on the cache is configurable, because an unbounded collection in a
; long-lived worker would be a second, unrelated bug.

[main]
; Distinct plugin ids the module-level memo may hold. Once full it stops
; admitting new ids rather than growing (see _admit in the module).
cache_capacity = 16

[diagnostics]
expected_verdict = fail
expected_failing_check = dynamic_suggestions_not_cached
