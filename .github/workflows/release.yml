name: release

# Cut a GitHub release from a tag, with one artefact set per platform.
#
# WHY THIS EXISTS
#
# `ci.yml` proves the tree is healthy on three operating systems; it produces
# nothing a user can install. The packaging scripts produce installable
# artefacts but two of the three only run on the platform they package for:
# WiX, makeappx and signtool are Windows binaries, and codesign, lipo and
# plutil ship with the Xcode command line tools. A release therefore has to be
# built on three runners and collected afterwards, which is what this workflow
# does. It drives the same scripts a human would run by hand - it never
# reimplements the packaging, so a defect here cannot make the released
# artefact differ from a locally built one.
#
# SIGNING
#
# No certificate is stored in this repository, so the Windows and macOS
# artefacts are built with the scripts' own `-Unsigned` / `--unsigned` paths and
# the release notes say so. That is a distribution limitation, not a hidden
# one: an unsigned MSI warns about an unknown publisher and an unsigned .app is
# refused by Gatekeeper on any machine but the one that built it. When
# certificates exist, drop the unsigned flag and pass the credentials the
# scripts already read from the environment.

on:
  push:
    tags: ["v*"]
  # A tag that was pushed before this workflow existed still needs a release,
  # and a failed publish needs a retry that does not require moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Install the packaging tools the script requires
        # `dpkg-deb` is present on the runner; `rpmbuild` is not, and the script
        # fails loudly rather than skipping the target, so install it here.
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils
      - name: Build the Linux artefacts
        # Flatpak is deliberately absent: it is built from the repository source
        # inside the freedesktop SDK and needs flatpak-builder plus a runtime
        # download, which is a different pipeline from packaging a built tree.
        run: packaging/linux/build.sh --targets stage,tarball,deb,rpm target/packaging/linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          # `rpmbuild` writes into a per-architecture subdirectory, so a flat
          # glob matches nothing there and `if-no-files-found` stays quiet
          # because the other two patterns did match.
          path: |
            target/packaging/linux/*.tar.gz
            target/packaging/linux/*.deb
            target/packaging/linux/**/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the release executables
        run: cargo build --release --locked --package crikey-cli --package crikey-wasm-host --package crikey-cabi-host
      - name: Install the WiX toolset
        # Deliberately not vendored, for the reason build.ps1 gives: the MSI is
        # produced by the published toolset, not by a copy in this repository.
        # The major version is pinned at both ends. `crikey.wxs` harvests the
        # payload directories with `<Files Include="...">`, which v4 does not
        # know (WIX0005), and WiX v6 and later refuse to build at all until an
        # Open Source Maintenance Fee licence is accepted (WIX7015). v5 is the
        # one version that both understands this authoring and needs no licence
        # acceptance, so an unpinned `dotnet tool install wix` fails on the
        # toolset rather than on anything in the tree.
        # The UI extension is pinned exactly. It supplies the dialog set, and a
        # package built without it installs with no window but a progress bar,
        # which reads to everyone who double-clicks it as an installer that
        # opened and then closed.
        # The Util extension supplies two things: `util:CloseApplication`,
        # which asks a running launcher to exit before the installer replaces
        # its own executable, and the `Wix4UtilCA_X64` custom action DLL behind
        # the finish dialog's "Start CriKey now" checkbox. Without it `wix
        # build` stops on an unknown element or an unresolved binary reference.
        run: |
          dotnet tool install --global wix --version "5.*"
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - name: Build the MSI
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Unsigned -Format msi -OutputDirectory target/packaging/windows
      - name: Prove the MSI has an installer UI
        # The gate below installs with `/qn`, which never opens a window, so
        # every quiet check in this pipeline passed while a double-click showed
        # nothing but a progress bar. Read the dialog set straight out of the
        # built package instead: a UI-less MSI has no Dialog table at all.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/packaging/windows/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $database.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $database, @('SELECT `Dialog` FROM `Dialog`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $dialogs = @()
          while ($true) {
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $record) { break }
            $dialogs += $record.GetType().InvokeMember(
              'StringData', 'GetProperty', $null, $record, @(1))
          }
          Write-Host "dialogs: $($dialogs.Count)"
          # The two that carry the whole complaint: one window before anything
          # is installed, and one saying it finished.
          foreach ($required in @('WelcomeEulaDlg', 'ExitDialog')) {
            if ($dialogs -notcontains $required) {
              throw "the MSI has no $required, so double-clicking it shows no installer"
            }
          }
          # And the licence shown must be CriKey's, not the toolset's sample.
          $license = Get-Content target/packaging/windows/LICENSE.rtf -Raw
          if ($license -notmatch 'Apache License') {
            throw 'the licence dialog would not show the Apache-2.0 text'
          }
      - name: Prove the package asks the launcher to close before it validates
        # The end-to-end gate further down installs over a running launcher and
        # requires it to be gone, but it cannot say which half did the work:
        # the launcher now answers a session-end request on its own, so Windows
        # Installer's Restart Manager could close it even if this package's own
        # request had been silently dropped. Read the sequence out of the built
        # package, so that a `util:CloseApplication` that stopped being
        # scheduled — a renamed decorated action id in a later WiX, an
        # architecture change under the `override` — fails here and names
        # itself, rather than surviving as a package that quietly depends on
        # Restart Manager guessing right about a hidden window.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/packaging/windows/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $database.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $database,
            @('SELECT `Action`, `Sequence` FROM `InstallExecuteSequence`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $sequence = @{}
          while ($true) {
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $record) { break }
            $action = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @(1))
            $sequence[$action] = [int]$record.GetType().InvokeMember(
              'IntegerData', 'GetProperty', $null, $record, @(2))
          }
          $close = $sequence.Keys | Where-Object { $_ -like '*CloseApplications*' }
          if (-not $close) {
            throw 'nothing in InstallExecuteSequence closes a running launcher'
          }
          foreach ($action in $close) {
            Write-Host "$action at $($sequence[$action]), InstallValidate at $($sequence['InstallValidate'])"
            if ($sequence[$action] -ge $sequence['InstallValidate']) {
              throw "$action runs after InstallValidate, which is where the file-in-use report the user sees comes from"
            }
          }
          # The row itself: the target has to be the resident executable, by
          # name, because that is what the custom action looks for.
          $view = $database.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $database,
            @('SELECT `Target` FROM `Wix4CloseApplication`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $targets = @()
          while ($true) {
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $record) { break }
            $targets += $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @(1))
          }
          if ($targets -notcontains 'crikey-launcher.exe') {
            throw "the close-application table targets $($targets -join ', '), not crikey-launcher.exe"
          }
      - name: Prove the finish dialog can start the launcher, and only the dialog can
        # `crikey.wxs` offers "Start CriKey now" on the exit dialog. Nothing
        # else in this pipeline can see it: every install here runs `/qn`, which
        # never opens a dialog, so the whole feature could be silently absent
        # and every other gate would still pass. A `DoAction` whose custom
        # action stopped being emitted, a WixUI control that got renamed under
        # it, or a condition somebody widened are all invisible until a user
        # double-clicks the package. Read the rows the feature is made of out of
        # the built database instead.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/packaging/windows/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          # Four tables are read below, so the fetch loop the steps above write
          # out by hand is a function here. Rows come back as objects rather
          # than arrays because PowerShell unrolls an array written to the
          # pipeline, which silently flattens a one-row result set.
          function Get-MsiRows($sql, $columns) {
            $view = $database.GetType().InvokeMember(
              'OpenView', 'InvokeMethod', $null, $database, @($sql))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rows = New-Object System.Collections.ArrayList
            while ($true) {
              $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
              if ($null -eq $record) { break }
              $row = [ordered]@{}
              for ($i = 0; $i -lt $columns.Count; $i++) {
                $row[$columns[$i]] = $record.GetType().InvokeMember(
                  'StringData', 'GetProperty', $null, $record, @($i + 1))
              }
              [void]$rows.Add([pscustomobject]$row)
            }
            return $rows
          }

          $launch = Get-MsiRows 'SELECT `Action`, `Type`, `Source`, `Target` FROM `CustomAction`' `
            @('Action', 'Type', 'Source', 'Target') |
            Where-Object { $_.Action -eq 'LaunchCrikeyLauncher' }
          if (-not $launch) {
            throw 'the MSI has no LaunchCrikeyLauncher custom action, so the finish dialog checkbox cannot start anything'
          }
          $type = [int]$launch.Type
          Write-Host "LaunchCrikeyLauncher: type $type, binary $($launch.Source), entry point $($launch.Target)"
          # Only the unelevated entry point routes the launch through the
          # desktop shell. WixShellExec would hand a launcher started from an
          # elevated install the installer's high-integrity token, and every
          # plugin process the launcher supervises would inherit it.
          if ($launch.Target -ne 'WixUnelevatedShellExec') {
            throw "LaunchCrikeyLauncher calls $($launch.Target), not WixUnelevatedShellExec, so an install started from an elevated shell would leave an elevated launcher behind"
          }
          # msidbCustomActionTypeInScript (1024) makes an action deferred, which
          # the ShellExec family cannot be, and msidbCustomActionTypeNoImpersonate
          # (2048) would run it as the installing account rather than the user.
          if ($type -band 1024) {
            throw 'LaunchCrikeyLauncher is deferred; the ShellExec custom actions only work as immediate actions'
          }
          if ($type -band 2048) {
            throw 'LaunchCrikeyLauncher no longer impersonates, so it would start the launcher as the installing account'
          }
          # msidbCustomActionTypeContinue (64): the product is installed and
          # committed by the time the Finish button exists, so a launch that
          # fails must not report the completed install as a failure.
          if (-not ($type -band 64)) {
            throw 'LaunchCrikeyLauncher does not ignore its return code, so a launcher that would not start would fail an install that had already succeeded'
          }

          $properties = @{}
          foreach ($row in (Get-MsiRows 'SELECT `Property`, `Value` FROM `Property`' @('Property', 'Value'))) {
            $properties[$row.Property] = $row.Value
          }
          # The target is a formatted file reference, resolved by the installer
          # to wherever the launcher landed. Asserted by name for the same
          # reason the close-application target is: the custom action does
          # whatever this property says and nothing checks it at build time.
          if ($properties['WixUnelevatedShellExecTarget'] -ne '[#CrikeyLauncherExe]') {
            throw "the launch target is '$($properties['WixUnelevatedShellExecTarget'])', not the installed crikey-launcher.exe"
          }
          if (-not $properties['WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT']) {
            throw 'the exit dialog has no optional checkbox text, so WixUI never draws the checkbox and the action can never be published'
          }
          if ($properties['WIXUI_EXITDIALOGOPTIONALCHECKBOX'] -ne '1') {
            throw 'the exit dialog checkbox no longer defaults to checked'
          }

          $events = Get-MsiRows 'SELECT `Dialog_`, `Control_`, `Event`, `Argument`, `Condition`, `Ordering` FROM `ControlEvent`' `
            @('Dialog', 'Control', 'Event', 'Argument', 'Condition', 'Ordering')
          $finish = $events | Where-Object { $_.Dialog -eq 'ExitDialog' -and $_.Control -eq 'Finish' }
          $doAction = $finish | Where-Object { $_.Event -eq 'DoAction' -and $_.Argument -eq 'LaunchCrikeyLauncher' }
          if (-not $doAction) {
            throw 'the Finish button of ExitDialog does not publish LaunchCrikeyLauncher, so the checkbox does nothing'
          }
          Write-Host "launch condition: $($doAction.Condition)"
          # Unchecked box, repair, or uninstall: WixUI_Minimal routes all three
          # through this same dialog, and the checkbox property is public and
          # can be set on the command line.
          foreach ($required in @('WIXUI_EXITDIALOGOPTIONALCHECKBOX', 'NOT Installed')) {
            if ($doAction.Condition -notlike "*$required*") {
              throw "the launch condition is '$($doAction.Condition)', which does not require '$required': it would fire on a repair or an uninstall, or with the box unchecked"
            }
          }
          # Control events fire in ascending order and EndDialog/Return closes
          # the UI sequence, so a launch ordered after it never runs.
          foreach ($end in ($finish | Where-Object { $_.Event -eq 'EndDialog' })) {
            Write-Host "DoAction at $($doAction.Ordering), EndDialog at $($end.Ordering)"
            if ([int]$doAction.Ordering -ge [int]$end.Ordering) {
              throw "the launch is published at order $($doAction.Ordering), at or after the EndDialog at $($end.Ordering), so clicking Finish would close the dialog without starting anything"
            }
          }
          # And the half that keeps an unattended install quiet: a control event
          # only exists inside a dialog, and `/qn` opens none. An action also
          # scheduled in either sequence table would run with no one watching
          # and put a GUI process on an unattended machine.
          foreach ($table in @('InstallExecuteSequence', 'InstallUISequence')) {
            $sql = 'SELECT `Action` FROM `' + $table + '`'
            $scheduled = Get-MsiRows $sql @('Action') | Where-Object { $_.Action -eq 'LaunchCrikeyLauncher' }
            if ($scheduled) {
              throw "LaunchCrikeyLauncher is scheduled in $table, so a silent /qn install would start the launcher with nobody watching"
            }
          }
      - name: Archive the staged tree as a portable zip
        # The MSI is a per-user install; the zip is what someone who wants to
        # run CriKey without installing it needs, and it is the same staged tree
        # the MSI packages rather than a second layout invented here.
        shell: pwsh
        run: Compress-Archive -Path target/packaging/windows/stage/* -DestinationPath target/packaging/windows/crikey-windows-x86_64-portable.zip
      - name: Install the MSI and prove the installed launcher actually starts
        # The owner's first report was "it installs and the app opens once,
        # then vanishes", and nothing in this pipeline could have caught that:
        # building an MSI proves it packages, not that what it installs runs.
        # This runs the real per-user install, starts the installed GUI entry
        # point the Start Menu shortcut starts, and requires it to still be
        # alive a few seconds later - which is the whole claim the shortcut
        # makes. A launcher that exits early fails here with its own
        # startup.log quoted, which is the file it writes for exactly this
        # case.
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/packaging/windows/*.msi)[0].FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $install = Start-Process msiexec -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "msiexec refused the package with exit code $($install.ExitCode)"
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\CriKey\crikey-launcher.exe'
          if (-not (Test-Path -LiteralPath $installed)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 2 | Out-String | Write-Host
            throw "the install did not put crikey-launcher.exe where the shortcut points"
          }
          $launcher = Start-Process $installed -PassThru
          Start-Sleep -Seconds 15
          $startupLog = Join-Path $env:LOCALAPPDATA 'CriKey\State\startup.log'
          if ($launcher.HasExited) {
            if (Test-Path -LiteralPath $startupLog) { Get-Content $startupLog | Write-Host }
            throw "the installed launcher exited with $($launcher.ExitCode) instead of staying resident"
          }
          # The reported defect, reproduced and gated: install over a launcher
          # that is running. Every install after the first one is this, because
          # the launcher is resident and `crikey-launcher.exe` is a file the
          # package replaces. It used to end in "setup was unable to close the
          # applications", because the launcher treated the shutdown request as
          # a dismissal and hid instead of exiting.
          #
          # Two things are asserted, and only both together mean it worked.
          # Exit code 0 and not 3010 (ERROR_SUCCESS_REBOOT_REQUIRED): a 3010 is
          # Windows Installer saying it gave up on closing the launcher and
          # queued the file replacement for the next reboot, which is the
          # failure wearing a success code. And the launcher process itself
          # gone: that is the half that proves it was asked and left, rather
          # than the installer having found some other way around it.
          #
          # REINSTALLMODE=vamus forces the file replacement a same-version
          # reinstall would otherwise skip, so the package really does have to
          # overwrite the running executable.
          $reinstallLog = Join-Path $env:RUNNER_TEMP 'reinstall.log'
          $reinstall = Start-Process msiexec -ArgumentList @(
            '/i', "`"$msi`"", '/qn', 'REINSTALL=ALL', 'REINSTALLMODE=vamus',
            '/l*v', "`"$reinstallLog`"") -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) {
            Select-String -Path $reinstallLog -Pattern 'RESTART MANAGER|CloseApp|FilesInUse' | Write-Host
            throw "installing over the running launcher failed with exit code $($reinstall.ExitCode)"
          }
          if (-not $launcher.WaitForExit(20000)) {
            Select-String -Path $reinstallLog -Pattern 'RESTART MANAGER|CloseApp|FilesInUse' | Write-Host
            Stop-Process -Id $launcher.Id -Force
            throw "the installer did not close the running launcher: it is still alive after the install"
          }
          # The defect the owner actually hit: they double-clicked `crikey.exe`,
          # which printed usage and exited, and read that as a broken program.
          # Bare `crikey.exe` now starts the same resident launcher, so it is
          # smoked the same way - started, left alone, and required to still be
          # running - rather than being taken on trust because the GUI entry
          # point passed.
          $console = Join-Path $env:LOCALAPPDATA 'Programs\CriKey\crikey.exe'
          $bare = Start-Process $console -PassThru
          Start-Sleep -Seconds 15
          if ($bare.HasExited) {
            if (Test-Path -LiteralPath $startupLog) { Get-Content $startupLog | Write-Host }
            throw "bare crikey.exe exited with $($bare.ExitCode) instead of starting the launcher"
          }
          Stop-Process -Id $bare.Id -Force
          # A subcommand must still be command-line output, since that is what
          # the documentation tells the user to type.
          & $console version
          if ($LASTEXITCODE -ne 0) { throw "the installed `crikey version` failed with $LASTEXITCODE" }
          # And an unknown argument must still be a named refusal rather than a
          # silently started launcher. Run through Start-Process rather than the
          # call operator: a deliberate non-zero exit would otherwise be the
          # last `$LASTEXITCODE` of this script, which the runner reads as the
          # step failing.
          $unknown = Start-Process $console -ArgumentList 'definitely-not-a-subcommand' `
            -Wait -PassThru -NoNewWindow
          if ($unknown.ExitCode -eq 0) { throw "an unknown subcommand must not be accepted" }
          $uninstall = Start-Process msiexec -ArgumentList @('/x', "`"$msi`"", '/qn') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall failed with $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/packaging/windows/*.msi
            target/packaging/windows/*.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architecture slices
        # Two slices rather than one: the bundle is assembled with `lipo` into a
        # universal binary, so one download runs on Apple silicon and Intel.
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" \
              --package crikey-cli --package crikey-wasm-host --package crikey-cabi-host
          done
      - name: Assemble CriKey.app
        run: |
          packaging/macos/build.sh --unsigned --output target/packaging/macos \
            --binary target/aarch64-apple-darwin/release/crikey \
            --binary target/x86_64-apple-darwin/release/crikey \
            --launcher-binary target/aarch64-apple-darwin/release/crikey-launcher \
            --launcher-binary target/x86_64-apple-darwin/release/crikey-launcher \
            --wasm-host-binary target/aarch64-apple-darwin/release/crikey-wasm-host \
            --wasm-host-binary target/x86_64-apple-darwin/release/crikey-wasm-host \
            --cabi-host-binary target/aarch64-apple-darwin/release/crikey-cabi-host \
            --cabi-host-binary target/x86_64-apple-darwin/release/crikey-cabi-host
      - name: Archive the bundle
        # `ditto` rather than `zip`, because it preserves the bundle's symlinks
        # and extended attributes; a zipped .app that loses them will not launch.
        run: ditto -c -k --sequesterRsrc --keepParent target/packaging/macos/CriKey.app target/packaging/macos/crikey-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: target/packaging/macos/*.zip

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Collect the artefacts and checksum them
        # One flat directory with one checksum file: a user who downloads an
        # artefact can verify it without knowing which runner produced it.
        run: |
          mkdir -p upload
          find artefacts -type f -exec mv {} upload/ \;
          cd upload
          sha256sum * > SHA256SUMS
          ls -l
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # The notes are written to a file rather than inlined into the `gh`
        # invocation: a heredoc closing delimiter cannot be indented, and an
        # indented body would put ten leading spaces on every line, which
        # Markdown renders as a code block.
        run: |
          {
            printf 'CriKey %s, built from this tag by `.github/workflows/release.yml`.\n\n' "$TAG"
            printf '| Platform | Artefact |\n| --- | --- |\n'
            printf '| Linux | `crikey-*-linux.tar.gz`, `.deb`, `.rpm` |\n'
            printf '| Windows | `CriKey-*.msi` (per-user), `crikey-windows-x86_64-portable.zip` |\n'
            printf '| macOS | `crikey-macos-universal.zip` (CriKey.app, universal) |\n\n'
            printf 'Verify a download against `SHA256SUMS`.\n\n'
            printf '**These artefacts are unsigned.** No code-signing certificate exists for\n'
            printf 'this project yet, so Windows SmartScreen reports an unknown publisher and\n'
            printf 'macOS Gatekeeper refuses the bundle until it is opened through the context\n'
            printf 'menu. The Linux artefacts are unaffected.\n\n'
            printf 'Platform runtime verification (M8) is still open: the Windows and macOS\n'
            printf 'backends compile and are covered by portable tests, but their native\n'
            printf 'runtime paths have not been exercised on real hardware. See\n'
            printf '`docs/ROADMAP.md` for the measured status.\n'
          } > release-notes.md
          # A re-run must converge on the same published state rather than
          # failing because the release already exists: a first attempt that
          # published five of six assets is exactly the case this has to
          # repair, so existing assets are replaced rather than appended to.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "CriKey $TAG" --notes-file release-notes.md
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" --title "CriKey $TAG" --notes-file release-notes.md upload/*
          fi
